name: Fetch News Intel to MongoDB

on:
  schedule:
    # Run daily at 00:00 UTC (07:00 Hanoi time)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch News Intel
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/fetch-news.mjs
