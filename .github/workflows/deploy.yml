name: Build and Deploy App

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        # Run next build directly to compile route handlers and pages for dynamic hosting (e.g. Vercel)
        run: npx next build

      # Add your deployment integration steps below if needed,
      # e.g., deploy to Vercel, Netlify, Docker registry, or custom server.
