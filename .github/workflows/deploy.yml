name: Fetch News and Deploy to GitHub Pages

on:
  schedule:
    # Run daily at 00:00 UTC (07:00 Hanoi time)
    - cron: '0 0 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

# Allow permissions required to deploy to GitHub Pages
permissions:
  contents: write

# Limit to one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch News Intel (Update DB & Runner Files)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/fetch-news.mjs

      - name: Determine Next.js Base Path
        id: base-path
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *".github.io" ]]; then
            echo "path=" >> $GITHUB_OUTPUT
          else
            echo "path=/$REPO_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base-path.outputs.path }}
          NEXT_PUBLIC_STATIC_MODE: 'true'
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
